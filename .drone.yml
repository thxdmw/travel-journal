kind: pipeline
name: gitee-drone

platform:
  os: linux
  arch: amd64

# Drone 由 Gitee 推送触发，并使用 Gitee 绑定凭据自动检出当前提交。
# 不再禁用 clone，验证步骤针对的代码与触发提交保持一致。
services:
  - name: postgres
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: travel_journal
      POSTGRES_USER: travel_journal
      POSTGRES_PASSWORD: travel_journal

  # 图片链路的集成验证要一个真的对象存储：/api/media/x/display 是一次 302 跳到
  # MinIO 预签名地址，重定向、跨源、opaque 响应这些用 mock 测不出来。
  # 桶直接用数据目录下的同名文件夹建出来，省掉一个 mc 客户端。
  - name: minio
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    environment:
      MINIO_ROOT_USER: ci-minio-access
      MINIO_ROOT_PASSWORD: ci-minio-secret
    commands:
      - mkdir -p /data/travel-journal-ci
      - minio server /data --address :9000

steps:
  - name: verify-frontend
    image: mcr.microsoft.com/playwright:v1.49.0-noble
    commands:
      - npm ci --prefix frontend --no-audit --no-fund
      - npm run lint --prefix frontend
      - npm run typecheck --prefix frontend
      - npm run test:unit --prefix frontend
      - npm run build --prefix frontend
      - npm run verify:build --prefix frontend

  - name: verify-backend
    image: maven:3.9.11-eclipse-temurin-21
    depends_on:
      - verify-frontend
    environment:
      FLYWAY_TEST_JDBC_URL: jdbc:postgresql://postgres:5432/travel_journal
      FLYWAY_TEST_DB_USERNAME: travel_journal
      FLYWAY_TEST_DB_PASSWORD: travel_journal
    commands:
      # 前一步已生成 frontend/dist；Maven 会把它复制进 Jar 的 classes/static。
      - mvn package -B -ntp

  - name: verify-mobile-smoke
    image: mcr.microsoft.com/playwright:v1.49.0-noble
    depends_on:
      - verify-backend
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: travel_journal
      DB_USERNAME: travel_journal
      DB_PASSWORD: travel_journal
      DB_SSL_MODE: disable
      MINIO_ENDPOINT: http://127.0.0.1:9000
      MINIO_ACCESS_KEY: ci-minio-access
      MINIO_SECRET_KEY: ci-minio-secret
      MINIO_BUCKET: travel-journal-ci
      MINIO_VERIFY_ON_STARTUP: "false"
      APP_ADMIN_USERNAME: admin
      APP_ADMIN_PASSWORD: ci-only-password-2026
      APP_ADMIN_DISPLAY_NAME: CI 旅行者
      APP_MAP_SEARCH_ENABLED: "false"
      APP_EMPTY_DRAFT_CLEANUP: "false"
      E2E_BASE_URL: http://127.0.0.1:8080
      E2E_ADMIN_USER: admin
      E2E_ADMIN_PASS: ci-only-password-2026
    commands:
      - apt-get update
      - DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends openjdk-21-jre-headless
      - npm ci --prefix frontend --no-audit --no-fund
      - |
        set -eu
        java -jar target/travel-journal.jar >/tmp/travel-journal-e2e.log 2>&1 &
        app_pid=$!
        trap 'kill "$${app_pid}" >/dev/null 2>&1 || true' EXIT
        ready=0
        for attempt in $(seq 1 60); do
          if curl --fail --silent http://127.0.0.1:8080/actuator/health >/dev/null; then
            ready=1
            break
          fi
          sleep 2
        done
        if [ "$${ready}" != "1" ]; then
          cat /tmp/travel-journal-e2e.log
          exit 1
        fi
        # actuator 说 UP 只代表进程起来了。登录之后的跳转还要串着 /api/public/profile 和
        # /api/public/csrf，这两个接口被第一个用例第一次碰到时要走完 JIT、Mapper 初始化
        # 和首次取连接——慢过 15 秒或者中途抛错，页面就停在登录页，表现为「登录后不跳转」。
        # 先替第一个用例把这几条路走一遍，冷启动的代价就不会算到它头上。
        for warm in /admin/ /api/public/profile /api/public/csrf; do
          curl --fail --silent --output /dev/null "http://127.0.0.1:8080$${warm}" || true
        done
        npm run e2e --prefix frontend -- --project=iphone-13 --grep @smoke

  # 图片权限缓存的真实链路：浏览器 → Service Worker → Spring Boot 302 → MinIO 预签名地址。
  # 这一段最近改动最多，也最容易悄悄回归，而 mock 单测和 @smoke 都覆盖不到它。
  # 单独一步是因为它需要 MinIO，而且要用 Chromium 才能测 Cache Storage 和 SW。
  - name: verify-media-integration
    image: mcr.microsoft.com/playwright:v1.49.0-noble
    # 排在冒烟之后而不是与它并行：两步共用同一个 PostgreSQL，同时跑会互相看见对方的数据
    depends_on:
      - verify-mobile-smoke
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: travel_journal
      DB_USERNAME: travel_journal
      DB_PASSWORD: travel_journal
      DB_SSL_MODE: disable
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ci-minio-access
      MINIO_SECRET_KEY: ci-minio-secret
      MINIO_BUCKET: travel-journal-ci
      # 这一步的重点就是对象存储，桶不通就该立刻失败，而不是等测试报一堆看不懂的错
      MINIO_VERIFY_ON_STARTUP: "true"
      APP_ADMIN_USERNAME: admin
      APP_ADMIN_PASSWORD: ci-only-password-2026
      APP_ADMIN_DISPLAY_NAME: CI 旅行者
      APP_MAP_SEARCH_ENABLED: "false"
      APP_EMPTY_DRAFT_CLEANUP: "false"
      E2E_BASE_URL: http://127.0.0.1:8080
      E2E_ADMIN_USER: admin
      E2E_ADMIN_PASS: ci-only-password-2026
    commands:
      - apt-get update
      - DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends openjdk-21-jre-headless
      - npm ci --prefix frontend --no-audit --no-fund
      - |
        set -eu
        java -jar target/travel-journal.jar >/tmp/travel-journal-media.log 2>&1 &
        app_pid=$!
        trap 'kill "$${app_pid}" >/dev/null 2>&1 || true' EXIT
        ready=0
        for attempt in $(seq 1 60); do
          if curl --fail --silent http://127.0.0.1:8080/actuator/health >/dev/null; then
            ready=1
            break
          fi
          sleep 2
        done
        if [ "$${ready}" != "1" ]; then
          cat /tmp/travel-journal-media.log
          exit 1
        fi
        # actuator 说 UP 只代表进程起来了。登录之后的跳转还要串着 /api/public/profile 和
        # /api/public/csrf，这两个接口被第一个用例第一次碰到时要走完 JIT、Mapper 初始化
        # 和首次取连接——慢过 15 秒或者中途抛错，页面就停在登录页，表现为「登录后不跳转」。
        # 先替第一个用例把这几条路走一遍，冷启动的代价就不会算到它头上。
        for warm in /admin/ /api/public/profile /api/public/csrf; do
          curl --fail --silent --output /dev/null "http://127.0.0.1:8080$${warm}" || true
        done
        npm run e2e --prefix frontend -- --project=desktop-chrome --grep @media

  - name: deploy-from-gitee
    image: appleboy/drone-ssh
    depends_on:
      - verify-backend
      - verify-frontend
      - verify-mobile-smoke
      - verify-media-integration
    settings:
      host: 43.130.247.22
      port: 2222
      username: tanghaixin
      password:
        from_secret: ssh_password
      command_timeout: 30m
      script:
        - set -eu
        - sudo mkdir -p /app/travel-journal
        - |
          if [ ! -d "/app/travel-journal/travel-journal/.git" ]; then
            echo "首次部署：从 Gitee 克隆仓库"
            sudo git clone --origin origin --branch master https://gitee.com/tang-haixin/travel-journal.git /app/travel-journal/travel-journal
          fi
        - cd /app/travel-journal/travel-journal
        - sudo git fetch --prune origin master
        # 部署目录只作为 Gitee 代码副本，不保留服务器上的跟踪文件修改。
        # 强制切换到本次触发的精确提交，既避免 master 前移造成版本错配，
        # 也会清理历史 chmod 或手工修改留下的脏工作树，防止 checkout 被阻塞。
        - sudo git checkout --force --detach ${DRONE_COMMIT_SHA}
        # 直接交给 Bash 执行，不再 chmod，避免把 deploy.sh 的权限位改成未提交状态。
        - sudo env DEPLOY_RELEASE_TAG=${DRONE_COMMIT_SHA} bash ./deploy.sh

trigger:
  event:
    - push
  branch:
    - master
