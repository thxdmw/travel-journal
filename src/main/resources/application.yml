spring:
  application:
    name: travel-journal
  profiles:
    default: dev
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:travel_journal_dev}?sslmode=${DB_SSL_MODE:prefer}
    username: ${DB_USERNAME:travel_journal_dev}
    password: ${DB_PASSWORD:travel_journal_dev}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  flyway:
    enabled: true
    locations: classpath:db/migration
  session:
    jdbc:
      # 建表交给 Flyway（V24），这里不要让 Spring Session 自己再建一次
      initialize-schema: never
  servlet:
    multipart:
      max-file-size: ${APP_UPLOAD_MAX_FILE_SIZE_MB:20}MB
      max-request-size: ${APP_UPLOAD_MAX_FILE_SIZE_MB:20}MB
  jackson:
    default-property-inclusion: non_null
    time-zone: UTC
server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: ${SERVER_FORWARD_HEADERS_STRATEGY:framework}
  servlet:
    session:
      # 30 天不活跃才过期，活跃会自动续期。手机上装成 PWA 偶尔用一次也不会掉线，
      # 真丢了设备可以在「个人资料 → 登录设备」里远程踢下线。
      timeout: ${SERVER_SESSION_TIMEOUT:30d}
      cookie:
        http-only: true
        same-site: lax
        # 不设 max-age 的是会话 cookie，浏览器一关就没了 —— 这正是「每次打开 PWA
        # 都要重新登录」的直接原因。和 session timeout 保持一致。
        max-age: ${SERVER_SESSION_TIMEOUT:30d}
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    # 接口文档默认关闭：它会把每个接口的路径、参数和示例列清楚，
    # 对一个公网上的个人站点来说等于白送一份地图。开发环境在 application-dev.yml 里打开。
    enabled: ${SPRINGDOC_UI_ENABLED:false}
  api-docs:
    enabled: ${SPRINGDOC_UI_ENABLED:false}
app:
  base-url: ${APP_BASE_URL:http://localhost:8080}
  security:
    # 可信反向代理的 IP，逗号分隔。只有直连方在这个名单里，才会采信 X-Forwarded-For：
    # 那个头由客户端自己填，无条件采信意味着换个假 IP 就能绕开登录限流。
    # 直接对外暴露（没有 Nginx）时留空。
    trusted-proxies: ${APP_TRUSTED_PROXIES:}
  site:
    # 季节主题按站点所在地判断，而不是访客设备的时区——否则东京的访客看到夏、
    # 悉尼的访客看到冬，同一个站点在同一天会长得不一样。
    timezone: ${APP_SITE_TIMEZONE:Asia/Shanghai}
  admin:
    username: ${APP_ADMIN_USERNAME:admin}
    # 仅用于管理员表为空时的首次创建，不提供任何默认值。
    password: ${APP_ADMIN_PASSWORD:}
    display-name: ${APP_ADMIN_DISPLAY_NAME:旅行者}
  upload:
    max-file-size-mb: ${APP_UPLOAD_MAX_FILE_SIZE_MB:20}
    max-images-per-journal: ${APP_UPLOAD_MAX_IMAGES_PER_JOURNAL:50}
    max-pixels: ${APP_UPLOAD_MAX_PIXELS:50000000}
  minio:
    # 凭证一律来自环境变量，配置文件里不留默认值：这个文件会随代码进仓库，
    # 写进去的密钥等同于公开发布。缺任何一项应用会拒绝启动，见 MinioConfig。
    endpoint: ${MINIO_ENDPOINT:}
    access-key: ${MINIO_ACCESS_KEY:}
    secret-key: ${MINIO_SECRET_KEY:}
    bucket: ${MINIO_BUCKET:travel-journal-dev}
    presigned-url-ttl-minutes: ${MINIO_PRESIGNED_URL_TTL_MINUTES:60}
    verify-on-startup: ${MINIO_VERIFY_ON_STARTUP:true}
  journal:
    empty-draft-cleanup:
      # 新建页会先把草稿攒在本地，写了东西才落服务端，所以空记录已经少了很多；
      # 但从旅行工作台开日记等路径仍然会留下空草稿。满 24 小时没人动过的由服务端
      # 统一回收，见 EmptyDraftCleaner。
      enabled: ${APP_EMPTY_DRAFT_CLEANUP:true}
  ai:
    # 留空表示不启用 AI 整理。整理随手记照常可用，只是不润色文字。
    api-key: ${ANTHROPIC_API_KEY:}
    model: ${ANTHROPIC_MODEL:claude-opus-5}
  map:
    provider: ${APP_MAP_PROVIDER:amap}
    amap-web-service-key: ${AMAP_WEB_SERVICE_KEY:}
    search-enabled: ${APP_MAP_SEARCH_ENABLED:true}
    # 前台地图展示：AUTO 按访客网络地区判断，也可以强制固定成 AMAP 或 OSM
    display-provider: ${APP_MAP_DISPLAY_PROVIDER:AUTO}
    # AUTO 判断不出访客地区时的兜底 Provider
    display-fallback: ${APP_MAP_DISPLAY_FALLBACK:AMAP}
    # 高德「Web端(JS API)」Key，用于前台地图展示；和上面的 Web 服务 Key 是两个不同的高德产品，
    # 不能混用。未配置时前台的「高德」选项不可用，AUTO 会一直落到 OSM
    amap-js-key: ${AMAP_JS_KEY:}
    # 高德 JS API 安全密钥只存在服务端，用于 /api/public/_AMapService/** 代理追加 jscode。
    amap-security-code: ${AMAP_SECURITY_CODE:}
    # 浏览器只拿到这个代理地址，不会拿到上面的安全密钥。也可以换成 Nginx 提供的 /_AMapService。
    amap-service-host: ${AMAP_SERVICE_HOST:/api/public/_AMapService}
    # OSM 兼容瓦片 Provider 可配置；地图瓦片不经过 Spring Boot，也不保存到 MinIO。
    osm-tile-url: ${OSM_TILE_URL:https://tile.openstreetmap.org/{z}/{x}/{y}.png}
    osm-attribution: ${OSM_ATTRIBUTION:© OpenStreetMap contributors}
    # 判断访客地区用的可信 header 名，例如反向代理注入的国家码（Cloudflare 的 CF-IPCountry 等）；
    # 留空表示不做地区判断，AUTO 直接使用 display-fallback
    geo-header-name: ${APP_MAP_GEO_HEADER:}
